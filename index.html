<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPER TRADES V4 - NEW DERIV</title><style>body{margin:0;background:#0a0e1a;color:#fff;font-family:Arial}.top{background:linear-gradient(90deg,#00ff88,#00d4ff);color:#000;padding:14px;font-weight:bold;text-align:center;font-size:18px}.box{margin:8px;background:#151d2f;border:1px solid #243356;border-radius:12px;padding:10px}select,input{width:100%;padding:11px;margin:5px 0;background:#0f1729;border:1px solid #2a3a5c;border-radius:8px;color:#fff}button{width:100%;padding:13px;border:none;border-radius:10px;font-weight:bold;margin:4px 0;cursor:pointer}.o{background:linear-gradient(90deg,#00ff88,#00d4ff);color:#000;font-size:16px}.r{background:#00ff88;color:#000}.f{background:#ff4444;color:#fff}.acc{background:linear-gradient(90deg,#ff6a00,#ee0979);color:#fff;font-size:15px}.turbo{background:linear-gradient(90deg,#00f5ff,#7000ff);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tick{font-size:30px;text-align:center;color:#00ff88;font-weight:bold}#last{font-size:42px;text-align:center;color:#fff;font-weight:bold}</style></head><body><div class="top">🚀 SUPER TRADES V4 - NEW DERIV 2026</div><div class="box"><button class="o" onclick="login()">🔐 1-CLICK DERIV LOGIN - NO TOKEN!</button><div style="text-align:center;margin:6px 0"><small style="color:#888">OR paste token if you want</small></div><input id="token" placeholder="Optional: Paste API Token"><button onclick="saveConn()" style="background:#1e2a44;color:#fff">CONNECT WITH TOKEN</button><p id="s" style="font-size:12px;text-align:center;color:#00ff88">Ready - Use 1-Click Login</p><div style="display:flex;justify-content:space-between"><b id="bal">$0.00</b><b id="prof" style="color:#00d4ff">Today $0.00</b></div><div id="err" style="color:#ff4444;font-size:11px;text-align:center"></div></div><div class="box"><label style="font-size:11px;color:#888">NEW CONTINUOUS INDICES (Never Invalid)</label><select id="sym" onchange="sub()"><option value="1HZ100V" selected>✅ Vol 100 (1s) Continuous - MAIN</option><option value="1HZ75V">Vol 75 (1s) Continuous</option><option value="1HZ50V">Vol 50 (1s) Continuous</option><option value="1HZ25V">Vol 25 (1s) Continuous</option><option value="1HZ10V">Vol 10 (1s) Continuous</option><option value="JD10">Jump 10 Index</option><option value="JD25">Jump 25</option><option value="JD50">Jump 50</option><option value="JD100">Jump 100</option></select><div id="last">-</div><div id="tik" class="tick">--</div><div id="market" style="text-align:center;font-size:11px;color:#888">Market: Closed? Wait for ticks</div></div><div class="box"><div class="grid"><input id="stake" type="number" value="1" placeholder="Stake"><select id="dur"><option value="1">1 Tick</option><option value="5">5 Ticks</option><option value="10">10 Ticks</option><option value="15">15 Ticks</option></select></div><div class="grid"><select id="dig"><option value="2">Digit 2</option><option value="0">0</option><option value="1">1</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option></select><select id="growth"><option value="0.01">Accu 1%</option><option value="0.02" selected>Accu 2%</option><option value="0.03">3%</option><option value="0.04">4%</option><option value="0.05">5% MAX</option></select></div><div class="grid"><input id="tp" type="number" placeholder="Take Profit $ (Accu)" value="10"><input id="sl" type="number" placeholder="Stop Loss $ (opt)" value=""></div></div><div class="box"><label style="font-size:11px;color:#00ff88">⚡ QUICK TRADES</label><div class="grid"><button class="r" onclick="trade('CALL')">📈 RISE</button><button class="f" onclick="trade('PUT')">📉 FALL</button></div></div><div class="box"><label style="font-size:11px;color:#00d4ff">🎯 DIGIT TRADES</label><div class="grid"><button style="background:#00d4ff;color:#000" onclick="trade('DIGITOVER')">OVER</button><button style="background:#ffaa00;color:#000" onclick="trade('DIGITUNDER')">UNDER</button><button style="background:#a855f7;color:#fff" onclick="trade('DIGITEVEN')">EVEN</button><button style="background:#7c3aed;color:#fff" onclick="trade('DIGITODD')">ODD</button><button style="background:#06b6d4;color:#000" onclick="trade('DIGITMATCH')">MATCH</button><button style="background:#f97316;color:#fff" onclick="trade('DIGITDIFF')">DIFFERS</button></div></div><div class="box"><label style="font-size:11px;color:#ff6a00">🔥 NEW DERIV FEATURES 2026</label><button class="acc" onclick="trade('ACCU')">🔥 ACCUMULATOR - GROW 2% PER TICK</button><button class="turbo" onclick="trade('TURBOSLONG')">⚡ TURBO LONG (NEW)</button><button class="turbo" onclick="trade('TURBOSSHORT')">⚡ TURBO SHORT (NEW)</button><div id="res" style="text-align:center;color:yellow;margin-top:10px;font-size:12px;font-weight:bold"></div><div id="pr" style="text-align:center;margin-top:5px"></div></div><script>var ws,ok=0,today=0;function login(){window.location.href='https://oauth.deriv.com/oauth2/authorize?app_id=1089&l=en&brand=deriv';}function saveConn(){var t=document.getElementById('token').value.trim();if(!t){alert('Paste token or use 1-Click Login');return;}localStorage.setItem('deriv_token',t);conn(t);}function conn(tok){tok=tok||localStorage.getItem('deriv_token')||new URLSearchParams(window.location.search).get('token1')||new URLSearchParams(window.location.search).get('token');if(!tok){document.getElementById('s').innerHTML='👆 TAP 1-CLICK LOGIN ABOVE - No token needed';return;}document.getElementById('token').value=tok;localStorage.setItem('deriv_token',tok);document.getElementById('s').innerHTML='Connecting to new Deriv API...';ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');ws.onopen=function(){ws.send(JSON.stringify({authorize:tok}));};ws.onmessage=function(e){var d=JSON.parse(e.data);if(d.authorize){if(d.error){document.getElementById('s').innerHTML='❌ '+d.error.message;document.getElementById('err').innerHTML='Try 1-Click Login instead';return;}ok=1;document.getElementById('s').innerHTML='✅ CONNECTED - '+d.authorize.loginid+' - NEW API READY';ws.send(JSON.stringify({balance:1,subscribe:1}));sub();setInterval(function(){if(ws&&ws.readyState==1)ws.send(JSON.stringify({ping:1}));},20000);}if(d.balance)document.getElementById('bal').innerHTML='$'+parseFloat(d.balance.balance).toFixed(2);if(d.tick){var q=d.tick.quote;document.getElementById('tik').innerHTML=q;document.getElementById('last').innerHTML=q.toString().slice(-1);document.getElementById('market').innerHTML='🟢 LIVE - '+d.tick.symbol+' - '+new Date().toLocaleTimeString();}if(d.buy){document.getElementById('res').innerHTML='✅ TRADE OPEN - '+d.buy.longcode.substring(0,80)+'...';ws.send(JSON.stringify({proposal_open_contract:1,contract_id:d.buy.contract_id,subscribe:1}));}if(d.proposal_open_contract&&d.proposal_open_contract.is_sold){var p=parseFloat(d.proposal_open_contract.profit);today+=p;document.getElementById('pr').innerHTML=(p>=0?'<b style=color:#00ff88>WIN +$'+p.toFixed(2)+'</b>':'<b style=color:#ff4444>LOSS $'+p.toFixed(2)+'</b>')+' | Today: $'+today.toFixed(2);document.getElementById('prof').innerHTML='Today $'+today.toFixed(2);if(p>0){document.getElementById('res').innerHTML='🎉 WIN! +$'+p.toFixed(2);} }if(d.error)document.getElementById('err').innerHTML=d.error.message;};ws.onclose=function(){document.getElementById('s').innerHTML='🔄 Reconnecting to new API...';setTimeout(function(){conn();},2000);};}function sub(){if(!ws||ws.readyState!=1)return;var s=document.getElementById('sym').value;ws.send(JSON.stringify({forget_all:'ticks'}));ws.send(JSON.stringify({ticks:s}));}function trade(type){if(!ok){alert('Please Login First - Tap 1-Click Login');return;}var st=parseFloat(document.getElementById('stake').value)||1;var du=parseInt(document.getElementById('dur').value)||1;var bar=document.getElementById('dig').value;var grow=parseFloat(document.getElementById('growth').value)||0.02;var p={amount:st,basis:'stake',currency:'USD',symbol:document.getElementById('sym').value,contract_type:type};if(type=='CALL'||type=='PUT'||type.includes('TURBO')){p.duration=du;p.duration_unit='t';}else if(type=='ACCU'){p.growth_rate=grow;var tp=document.getElementById('tp').value;if(tp)p.take_profit=parseFloat(tp);}else{p.duration=du;p.duration_unit='t';if(type!='DIGITEVEN'&&type!='DIGITODD')p.barrier=bar;}if(type.includes('TURBO')){p.barrier_offset='+0.5';}ws.send(JSON.stringify({buy:1,price:st,parameters:p}));document.getElementById('res').innerHTML='⏳ Placing '+type+' on NEW API...';}window.onload=function(){var urlToken=new URLSearchParams(window.location.search).get('token1')||new URLSearchParams(window.location.search).get('token');if(urlToken){localStorage.setItem('deriv_token',urlToken);conn(urlToken);window.history.replaceState({},document.title,'/');}else{var saved=localStorage.getItem('deriv_token');if(saved)conn(saved);}};</script></body></html>
