<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperBot V2 - Deriv Auto Trader</title>
<style>
body{background:#0a0e1a;color:white;font-family:Arial;text-align:center;padding:20px}
.btn{background:#00ff88;color:black;padding:18px 30px;border:none;border-radius:12px;font-size:18px;font-weight:bold;width:90%;max-width:400px;margin:15px;cursor:pointer}
.card{background:#151a2c;padding:20px;border-radius:15px;margin:20px auto;max-width:450px;border:1px solid #00ff88}
input,select{padding:12px;width:80%;margin:8px;border-radius:8px;border:none}
</style>
</head>
<body>
<h1>🚀 SuperBot V2 PRO</h1>
<div class="card" id="loginCard">
<h3>Login to Deriv</h3>
<p>Secure OAuth - No token needed</p>
<button class="btn" onclick="login()">🔐 LOGIN WITH DERIV</button>
<p style="font-size:12px;color:#888">App ID: 34fNg2TwtAKYDBNBc6B3L<br>2% Markup Active</p>
</div>

<div class="card" id="tradeCard" style="display:none">
<h3>✅ Connected: <span id="acc"></span></h3>
<p>Balance: <span id="bal">$0</span></p>
<select id="market"><option value="1HZ10V">Volatility 10</option><option value="1HZ25V">Volatility 25</option><option value="1HZ50V">Volatility 50</option><option value="1HZ100V">Volatility 100</option></select><br>
<input id="stake" type="number" value="1" placeholder="Stake $"><br>
<button class="btn" onclick="startBot()">▶️ START BOT</button>
<button class="btn" style="background:#ff4444;color:white" onclick="stopBot()">⏹️ STOP</button>
<p id="log" style="font-size:13px;text-align:left;background:black;padding:10px;border-radius:8px;height:150px;overflow:auto"></p>
</div>

<script>
const APP_ID="34fNg2TwtAKYDBNBc6B3L";
let token=null; let ws=null; let running=false;

function login(){
window.location.href=`https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}&l=en&signup_device=desktop`;
}

function getTokenFromUrl(){
const urlParams=new URLSearchParams(window.location.search);
for(const [key,value] of urlParams){
if(key.startsWith('token')){
return value;
}
}
const hash=new URLSearchParams(window.location.hash.substring(1));
for(const [key,value] of hash){
if(key.startsWith('token')) return value;
}
return null;
}

window.onload=()=>{
token=getTokenFromUrl();
if(token){
document.getElementById('loginCard').style.display='none';
document.getElementById('tradeCard').style.display='block';
connect();
}else{
const saved=localStorage.getItem('deriv_token');
if(saved){token=saved;document.getElementById('loginCard').style.display='none';document.getElementById('tradeCard').style.display='block';connect();}
}
}

function connect(){
ws=new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);
ws.onopen=()=>{ws.send(JSON.stringify({authorize:token})); log('Connecting...')};
ws.onmessage=(msg)=>{
const data=JSON.parse(msg.data);
if(data.authorize){document.getElementById('acc').innerText=data.authorize.loginid; localStorage.setItem('deriv_token',token); ws.send(JSON.stringify({balance:1})); log('Authorized! '+data.authorize.loginid)}
if(data.balance){document.getElementById('bal').innerText='$'+data.balance.balance}
if(data.buy){log('Bought: '+data.buy.contract_id+' Price: $'+data.buy.buy_price)}
};
}

function log(t){const el=document.getElementById('log');el.innerHTML+=new Date().toLocaleTimeString()+' - '+t+'<br>';el.scrollTop=el.scrollHeight;}

function startBot(){
if(running) return; running=true; log('BOT STARTED with 2% markup');
const stake=parseFloat(document.getElementById('stake').value);
const market=document.getElementById('market').value;
function trade(){
if(!running) return;
ws.send(JSON.stringify({buy:1,price:stake,parameters:{amount:stake,basis:'stake',contract_type:'CALL',currency:'USD',duration:1,duration_unit:'t',symbol:market,app_markup_percentage:2}}));
setTimeout(trade,5000);
}
trade();
}

function stopBot(){running=false; log('BOT STOPPED')}
</script>
</body>
</html>
