<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperBot V2 PRO</title>
<style>
body{background:#0a0e1a;color:#fff;font-family:Arial;text-align:center;padding:15px;margin:0}
.card{background:#151a2c;padding:20px;border-radius:15px;max-width:450px;margin:20px auto;border:1px solid #00ff88}
.btn{background:#00ff88;color:#000;padding:16px;border:none;border-radius:10px;font-weight:bold;width:90%;margin:8px;font-size:16px}
input,select{padding:12px;width:88%;margin:8px;border-radius:8px;border:none}
#log{background:#000;color:#0f0;text-align:left;padding:10px;border-radius:8px;height:160px;overflow:auto;font-size:11px}
</style>
</head>
<body>
<h1>🚀 SuperBot V2 PRO</h1>
<div class="card">
<h3>Paste Deriv PAT Token</h3>
<input id="token" placeholder="Paste pat_ token here">
<br>
<select id="market">
<option value="1HZ10V">Vol 10</option>
<option value="1HZ25V">Vol 25</option>
<option value="1HZ50V">Vol 50</option>
<option value="1HZ100V">Vol 100</option>
</select>
<br>
<input id="stake" type="number" value="1" placeholder="Stake">
<br>
<button class="btn" onclick="connect()">🔐 CONNECT & START</button>
<button class="btn" style="background:#ff4444;color:white" onclick="stopBot()">⏹️ STOP</button>
<p>Balance: <span id="bal">-</span> | Acc: <span id="acc">-</span></p>
<div id="log">Waiting...</div>
<p style="font-size:9px;color:#666">App: 34fNg2TwtAKYDBNBc6B3L | Markup 2%</p>
</div>
<script>
const APP_ID="34fNg2TwtAKYDBNBc6B3L"; let ws,running=false;
function log(t){let e=document.getElementById('log');e.innerHTML+=new Date().toLocaleTimeString()+" - "+t+"<br>";e.scrollTop=e.scrollHeight;}
function connect(){
let token=document.getElementById('token').value.trim();
if(!token){alert("Paste token!");return;}
ws=new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);
ws.onopen=()=>{ws.send(JSON.stringify({authorize:token})); log("Authorizing...");};
ws.onmessage=(m)=>{let d=JSON.parse(m.data);
if(d.authorize){document.getElementById('acc').innerText=d.authorize.loginid; ws.send(JSON.stringify({balance:1})); log("✅ Connected "+d.authorize.loginid); startBot();}
if(d.balance){document.getElementById('bal').innerText="$"+d.balance.balance;}
if(d.error){log("❌ ERROR: "+d.error.message);}
if(d.buy){log("💰 BOUGHT: "+d.buy.contract_id+" Price $"+d.buy.buy_price+" (2% markup)");}
};
ws.onerror=()=>log("Connection error");
}
function startBot(){if(running)return; running=true;
let stake=parseFloat(document.getElementById('stake').value);
let market=document.getElementById('market').value;
log("BOT STARTED - Markup 2% Active");
function trade(){if(!running)return;
ws.send(JSON.stringify({buy:1,price:stake,parameters:{amount:stake,basis:"stake",contract_type:"CALL",currency:"USD",duration:1,duration_unit:"t",symbol:market,app_markup_percentage:2}}));
setTimeout(trade,6000);} trade();
}
function stopBot(){running=false; log("STOPPED");}
</script>
</body>
</html>
