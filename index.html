<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPER TRADES V2</title><style>body{margin:0;background:#0a0e1a;color:#fff;font-family:Arial}.top{background:#00ff88;color:#000;padding:12px;font-weight:bold;text-align:center;font-size:16px}.box{margin:8px;background:#151d2f;border:1px solid #243356;border-radius:12px;padding:10px}input,select{width:100%;padding:10px;margin:4px 0;background:#0f1729;border:1px solid #2a3a5c;border-radius:8px;color:#fff}button{width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;margin:3px 0;cursor:pointer}.r{background:#00ff88;color:#000}.f{background:#ff4444;color:#fff}.o{background:#00d4ff;color:#000}.u{background:#ffaa00;color:#000}.e{background:#a855f7;color:#fff}.od{background:#7c3aed;color:#fff}.m{background:#06b6d4;color:#000}.d{background:#f97316;color:#fff}.acc{background:linear-gradient(90deg,#ff6a00,#ee0979);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.tick{font-size:26px;text-align:center;color:#00ff88;font-weight:bold}#last{font-size:34px;text-align:center}</style></head><body><div class="top">💵 SUPER TRADES V2 - FIXED + ACCU</div><div class="box"><input id="token" placeholder="Deriv API Token"><button onclick="conn()" style="background:#00ff88;color:#000">CONNECT</button><p id="s" style="font-size:11px;text-align:center;color:#888">Not Connected</p><b id="bal">$0.00</b> | <b id="prof" style="color:#00d4ff">$0.00</b><div id="err" style="color:#ff4444;font-size:11px;text-align:center"></div></div><div class="box"><select id="sym" onchange="sub()"><option value="R_10">Vol 10</option><option value="R_25">Vol 25</option><option value="R_50">Vol 50</option><option value="R_75">Vol 75</option><option value="R_100" selected>Vol 100 (Old)</option><option value="1HZ10V">Vol 10 (1s) - NEW FIX</option><option value="1HZ25V">Vol 25 (1s)</option><option value="1HZ50V">Vol 50 (1s)</option><option value="1HZ75V">Vol 75 (1s)</option><option value="1HZ100V">Vol 100 (1s) - BEST</option></select><div id="last">-</div><div id="tik" class="tick">--</div></div><div class="box"><input id="stake" type="number" value="1"><select id="dur"><option value="1">1 Tick</option><option value="5">5 Ticks</option><option value="10">10 Ticks</option></select><select id="dig"><option value="2" selected>Digit 2</option><option value="0">0</option><option value="1">1</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option></select><select id="growth"><option value="0.01">Accu Growth 1%</option><option value="0.02" selected>2%</option><option value="0.03">3%</option><option value="0.04">4%</option><option value="0.05">5%</option></select></div><div class="box"><div class="grid"><button class="r" onclick="t('CALL')">RISE</button><button class="f" onclick="t('PUT')">FALL</button></div></div><div class="box"><div class="grid"><button class="o" onclick="t('DIGITOVER')">OVER</button><button class="u" onclick="t('DIGITUNDER')">UNDER</button><button class="e" onclick="t('DIGITEVEN')">EVEN</button><button class="od" onclick="t('DIGITODD')">ODD</button><button class="m" onclick="t('DIGITMATCH')">MATCH</button><button class="d" onclick="t('DIGITDIFF')">DIFFERS</button></div><button class="acc" onclick="t('ACCU')">🔥 ACCUMULATOR - GROW MONEY</button></div><div class="box"><div id="res" style="text-align:center;color:yellow;font-size:12px"></div><div id="pr" style="text-align:center;margin-top:5px"></div></div><script>var ws,ok=0,today=0,curSym="R_100";function conn(){var tok=document.getElementById('token').value.trim();if(!tok){alert('Paste API Token');return;}document.getElementById('s').innerHTML='Connecting...';ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');ws.onopen=function(){ws.send(JSON.stringify({authorize:tok}));};ws.onmessage=function(e){var d=JSON.parse(e.data);console.log(d);if(d.msg_type=='authorize'){if(d.error){document.getElementById('s').innerHTML='❌ '+d.error.message;document.getElementById('err').innerHTML=d.error.message;return;}ok=1;document.getElementById('s').innerHTML='✅ CONNECTED - '+d.authorize.loginid;document.getElementById('err').innerHTML='';ws.send(JSON.stringify({balance:1,subscribe:1}));setTimeout(sub,500);}if(d.balance)document.getElementById('bal').innerHTML='$'+d.balance.balance;if(d.tick){var q=d.tick.quote;document.getElementById('tik').innerHTML=q;document.getElementById('last').innerHTML=q.toString().slice(-1);}if(d.error&&d.error.code=='InvalidSymbol'){document.getElementById('err').innerHTML=d.error.message+' -> Switching to 1HZ100V';document.getElementById('sym').value='1HZ100V';setTimeout(sub,500);}if(d.buy){document.getElementById('res').innerHTML='✅ '+d.buy.longcode;ws.send(JSON.stringify({proposal_open_contract:1,contract_id:d.buy.contract_id,subscribe:1}));}if(d.proposal_open_contract&&d.proposal_open_contract.is_sold){var p=parseFloat(d.proposal_open_contract.profit);today+=p;document.getElementById('pr').innerHTML=(p>=0?'<b style=color:#00ff88>WIN +$'+p.toFixed(2)+'</b>':'<b style=color:#ff4444>LOSS $'+p.toFixed(2)+'</b>')+' | Today: $'+today.toFixed(2);document.getElementById('prof').innerHTML='$'+today.toFixed(2);}if(d.error&&d.msg_type!='authorize'&&d.error.code!='InvalidSymbol')document.getElementById('err').innerHTML=d.error.message;};ws.onerror=function(){document.getElementById('s').innerHTML='❌ Connection error';};}function sub(){if(!ws||ws.readyState!=1)return;var s=document.getElementById('sym').value;curSym=s;ws.send(JSON.stringify({forget_all:'ticks'}));ws.send(JSON.stringify({ticks:s}));document.getElementById('err').innerHTML='Subscribing '+s+'...';}function t(type){if(!ok){alert('Connect first with API Token');return;}var st=parseFloat(document.getElementById('stake').value)||1;var du=parseInt(document.getElementById('dur').value)||1;var bar=document.getElementById('dig').value;var grow=parseFloat(document.getElementById('growth').value)||0.02;var p={amount:st,basis:'stake',currency:'USD',symbol:document.getElementById('sym').value,contract_type:type};if(type=='CALL'||type=='PUT'){p.duration=du;p.duration_unit='t';}else if(type=='ACCU'){p.growth_rate=grow;}else{p.duration=du;p.duration_unit='t';if(type=='DIGITOVER'||type=='DIGITUNDER'||type=='DIGITMATCH'||type=='DIGITDIFF')p.barrier=bar;}ws.send(JSON.stringify({buy:1,price:st,parameters:p}));document.getElementById('res').innerHTML='Placing '+type+'...';}</script></body></html>
